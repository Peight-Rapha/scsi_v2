<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SCSI{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #172033; }
        main { min-height: 100vh; display: grid; place-items: start center; padding: 24px; }
        .card { width: min(100%, 480px); background: #fff; border: 1px solid #dbe3ef; border-radius: 16px; padding: 32px; box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08); }
        .app-shell { width: min(100%, 1180px); }
        h1 { margin: 0 0 12px; font-size: 28px; }
        p { line-height: 1.5; }
        label { display: block; margin: 16px 0 6px; font-weight: 700; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #c8d2e1; border-radius: 10px; font: inherit; }
        button, .button { display: inline-block; margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 10px; background: #1947e5; color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; }
        .links { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; }
        .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid #dbe3ef; }
        .nav a, .nav button { display: inline-flex; align-items: center; min-height: 34px; padding: 0 10px; border-radius: 999px; background: #f3f6fb; text-decoration: none; border: 0; margin: 0; color: #1947e5; font: inherit; font-weight: 700; cursor: pointer; }
        .nav a, .links a { color: #1947e5; font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .metric { border: 1px solid #dbe3ef; border-radius: 12px; padding: 16px; background: #fff; }
        .metric strong { display: block; font-size: 24px; color: #172033; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; display: block; overflow-x: auto; }
        th, td { border-bottom: 1px solid #dbe3ef; padding: 10px; text-align: left; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #edf2ff; color: #1947e5; font-size: 12px; font-weight: 700; }
        .errorlist { color: #b42318; padding-left: 20px; }
        @media (max-width: 720px) {
            main { padding: 12px; }
            .card { padding: 20px; border-radius: 12px; }
            .nav a, .nav form, .nav button { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<main>
    <section class="card{% if user.is_authenticated %} app-shell{% endif %}">
        {% if user.is_authenticated %}
            <nav class="nav">
                <a href="{% url 'dashboard:index' %}">Dashboard</a>
                <a href="{% url 'clients:list' %}">Clientes</a>
                <a href="{% url 'crm:list' %}">CRM</a>
                <a href="{% url 'proposals:list' %}">Propostas</a>
                <a href="{% url 'policies:list' %}">Apólices</a>
                <a href="{% url 'claims:list' %}">Sinistros</a>
                <a href="{% url 'renewals:list' %}">Renovações</a>
                <a href="{% url 'commissions:list' %}">Comissões</a>
                <a href="{% url 'reports:index' %}">Relatórios</a>
                <a href="{% url 'ai_agents:chat' %}">Chat com IA</a>
                <a href="{% url 'notifications:list' %}">Notificações</a>
                <a href="{% url 'accounts:user_list' %}">Configurações</a>
                <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit">Sair</button></form>
            </nav>
        {% endif %}
        {% block content %}{% endblock %}
    </section>
</main>
</body>
</html>
